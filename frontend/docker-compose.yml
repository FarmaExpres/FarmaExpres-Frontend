name: ${COMPOSE_PROJECT_NAME:-farmaexpres-frontend}

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${FRONTEND_CONTAINER_NAME:-farmaexpres-frontend-dev}
    image: ${FRONTEND_IMAGE_NAME:-farmaexpres-frontend:dev}
    environment:
      # Debe apuntar al api-gateway del backend del mismo ambiente.
      # En red Docker interna el gateway escucha en 8080 para todos los ambientes.
      - BACKEND_URL=${BACKEND_URL:-http://api-gateway:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend_env_network
    restart: unless-stopped

networks:
  backend_env_network:
    external: true
    name: ${BACKEND_NETWORK}
