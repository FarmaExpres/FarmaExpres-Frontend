name: Audit Workflow Changes

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    paths:
      - ".github/workflows/**"

jobs:
  audit-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan workflow changes for dangerous commands
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            echo "No base SHA available; skipping scan."
            exit 0
          fi

          mapfile -t CHANGED < <(git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}" -- ".github/workflows/")

          if [[ ${#CHANGED[@]} -eq 0 ]]; then
            echo "No workflow changes detected."
            exit 0
          fi

          echo "Scanning changed workflows:"
          printf '%s\n' "${CHANGED[@]}"

          PATTERN='(curl[[:space:]].*-X[[:space:]]*DELETE|curl[[:space:]].*--request[[:space:]]*DELETE|gh[[:space:]]+api[[:space:]].*-X[[:space:]]*DELETE|--method[[:space:]]*DELETE)'

          if grep -nE "${PATTERN}" "${CHANGED[@]}"; then
            echo "Dangerous DELETE API usage detected in workflows."
            exit 1
          fi

          echo "No dangerous commands detected."
